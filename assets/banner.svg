<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow1" cx="15%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="380" fill="#070b14"/>
  <rect width="1200" height="380" fill="url(#glow1)"/>
  <rect width="1200" height="380" fill="url(#glow2)"/>

  <!-- subtle grid dots -->
  <g fill="#1e293b" opacity="0.5">
    <circle cx="60" cy="40" r="1.5"/><circle cx="140" cy="40" r="1.5"/><circle cx="220" cy="40" r="1.5"/>
    <circle cx="60" cy="340" r="1.5"/><circle cx="140" cy="340" r="1.5"/><circle cx="220" cy="340" r="1.5"/>
    <circle cx="1000" cy="40" r="1.5"/><circle cx="1080" cy="40" r="1.5"/><circle cx="1140" cy="40" r="1.5"/>
    <circle cx="1000" cy="340" r="1.5"/><circle cx="1080" cy="340" r="1.5"/><circle cx="1140" cy="340" r="1.5"/>
  </g>

  <!-- left side: agent chip + connected tool nodes -->
  <g transform="translate(90,150)">
    <!-- connecting lines -->
    <line x1="60" y1="40" x2="150" y2="-40" stroke="#334155" stroke-width="2"/>
    <line x1="60" y1="40" x2="150" y2="40" stroke="#334155" stroke-width="2"/>
    <line x1="60" y1="40" x2="150" y2="120" stroke="#334155" stroke-width="2"/>
    <line x1="60" y1="40" x2="20" y2="130" stroke="#334155" stroke-width="2"/>

    <!-- central agent chip -->
    <rect x="10" y="0" width="100" height="80" rx="20" fill="url(#chipGrad)"/>
    <circle cx="40" cy="30" r="6" fill="#ffffff"/>
    <circle cx="80" cy="30" r="6" fill="#ffffff"/>
    <rect x="35" y="48" width="50" height="8" rx="4" fill="#ffffff" opacity="0.85"/>

    <!-- tool nodes -->
    <circle cx="150" cy="-40" r="20" fill="url(#nodeGrad)"/>
    <text x="150" y="-35" text-anchor="middle" font-family="Arial" font-size="16" fill="#070b14" font-weight="bold">RAG</text>

    <circle cx="150" cy="40" r="20" fill="url(#nodeGrad)"/>
    <text x="150" y="45" text-anchor="middle" font-family="Arial" font-size="20" fill="#070b14" font-weight="bold">+</text>

    <circle cx="150" cy="120" r="20" fill="url(#nodeGrad)"/>
    <text x="150" y="125" text-anchor="middle" font-family="Arial" font-size="20" fill="#070b14" font-weight="bold">✓</text>

    <circle cx="20" cy="130" r="20" fill="url(#nodeGrad)"/>
    <text x="20" y="135" text-anchor="middle" font-family="Arial" font-size="18" fill="#070b14" font-weight="bold">@</text>
  </g>

  <!-- right side: title -->
  <g transform="translate(420,0)">
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="30" letter-spacing="6" fill="#38bdf8" font-weight="bold">AGENTIC AI CONSULTATION</text>
    <text x="0" y="215" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="url(#titleGrad)">AI Project Consultant</text>
    <text x="0" y="260" font-family="Arial, sans-serif" font-size="22" fill="#8b9bb0">RAG &#183; Tool Calling &#183; Conversational State &#183; Lead Capture</text>

    <!-- status pill -->
    <rect x="0" y="285" width="220" height="34" rx="17" fill="none" stroke="#38bdf8" stroke-opacity="0.4"/>
    <circle cx="20" cy="302" r="5" fill="#10b981"/>
    <text x="35" y="307" font-family="Arial, sans-serif" font-size="14" fill="#67e8f9">Streamlit &#8226; LangChain &#8226; Groq</text>
  </g>
</svg>
