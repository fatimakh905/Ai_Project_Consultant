<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>

    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#06111f"/>
      <stop offset="46%" stop-color="#071726"/>
      <stop offset="100%" stop-color="#06121f"/>
    </linearGradient>

    <radialGradient id="glowTopLeft" cx="8%" cy="5%" r="55%">
      <stop offset="0%"  stop-color="#1c5fb4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1c5fb4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowTopRight" cx="92%" cy="22%" r="50%">
      <stop offset="0%"  stop-color="#0894b5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0894b5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%"   stop-color="#176fe5" stop-opacity="0.32"/>
      <stop offset="55%"  stop-color="#0aa6c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2d4c9b" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0%"   stop-color="#0d3d6b" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#0a6f8a" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#123a63" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0.08">
      <stop offset="0%"   stop-color="#08213b" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#0b3350" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#08213b" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#35d0e6" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4aa7ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#35d0e6" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#base)"/>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#glowTopLeft)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#glowTopRight)"/>

  <g filter="url(#softer)">
    <path d="M0,760
             C 260,690 480,830 760,780
             C 1040,730 1260,640 1560,700
             C 1700,730 1820,700 1920,660
             L 1920,1080 L 0,1080 Z"
          fill="url(#wave3)"/>
  </g>

  <g filter="url(#soft)">
    <path d="M0,840
             C 300,760 560,900 880,850
             C 1180,805 1420,730 1680,790
             C 1800,818 1860,800 1920,780
             L 1920,1080 L 0,1080 Z"
          fill="url(#wave2)"/>
  </g>

  <g filter="url(#soft)">
    <path d="M0,920
             C 320,860 620,970 940,930
             C 1240,895 1480,840 1700,890
             C 1800,912 1860,905 1920,895
             L 1920,1080 L 0,1080 Z"
          fill="url(#wave1)"/>
  </g>

  <path d="M0,742
           C 260,672 480,812 760,762
           C 1040,712 1260,622 1560,682
           C 1700,712 1820,682 1920,642"
        fill="none"
        stroke="url(#hairline)"
        stroke-width="1.4"
        opacity="0.6"/>

  <path d="M0,822
           C 300,742 560,882 880,832
           C 1180,787 1420,712 1680,772
           C 1800,800 1860,782 1920,762"
        fill="none"
        stroke="url(#hairline)"
        stroke-width="1"
        opacity="0.4"/>

</svg>
